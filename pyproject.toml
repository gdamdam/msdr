[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msdr"
version = "1.0.0rc6"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "msdr/ui/vendor/LIT-LICENSE.txt", "msdr/ui/vendor/LEAFLET-LICENSE.txt"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets>=12",
    "pydantic>=2",
    "skyfield>=1.49",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
ble = [
    "pyusb>=1.2,<2",
    "pyserial>=3.5,<4",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-playwright",
    "pytest-timeout",
    "httpx",
    "ruff",
]

[project.scripts]
msdr = "msdr.api.main:main"

[tool.hatch.build.targets.wheel]
include = ["msdr/**"]

[tool.pytest.ini_options]
# msdr/decoder/signal_test.py is a CLI probe, not a test; without testpaths a
# bare `pytest` collects it and errors on its `test_signal(frequency_hz, ...)`.
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: browser test needing --e2e and a real Chromium (see tests/e2e/conftest.py)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() are meant to be called in argument defaults;
# this is ruff's documented way to stop B008 flagging that idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
